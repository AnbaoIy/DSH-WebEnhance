# DSH-WebEnhance — 把 web seam 的搜索与抓取分别指向不同供应商。
#
#   web_search -> Parallel  /v1/search   (provider id: parallel)
#   web_fetch  -> Tavily    /extract     (provider id: auto)
#                   └─ 额度耗尽 / 触发反爬 / 抓不到正文 时升级 Firecrawl /v2/scrape
#   web_fetch  -> Firecrawl /v2/scrape   (provider id: firecrawl，强制单家，调试与应急用)
#
# 凭据默认从环境变量读取：PARALLEL_API_KEY / TAVILY_API_KEY / FIRECRAWL_API_KEY。
# 也可以在下面的 config 里写字面量 key，例如：
#   config:
#     search: { apiKey: '...' }
#     fetch:
#       tavily: { apiKey: '...' }
#       firecrawl: { apiKey: '...' }

- insert:
    - id: web-enhance
      name: 'dsh-webenhance'

# 覆盖内置的 provider 选择（原行只有这两个键，patch 会替换整行 config）。
- id: web
  config:
    searchProvider: parallel
    fetchProvider: auto

# Tavily + Firecrawl 已经取代内置 DeepSeek 搜索，因此不再需要 DEEPSEEK_API_KEY。
- id: web-search-deepseek
  disabled: true

# 注意：工具层的超时（tool-web.fetchTimeoutMs，默认 30000）在这里改不到。
# agent 预设里真正生效的那份 tool-web 嵌在 preset-standard.config.plugins[] 内，
# 而 cordis.patch.yml 只能按 id 定位顶层条目、并整体替换它的 config
# （见 dsh-app-boot README：「用户 patch 会替换匹配到的整个配置」）。
# 因此本插件把 fetch.totalTimeoutMs 的默认值压到 28000，稳在 30s 之内。
# 想让升级链跑得更久，请先在 agent 预设里把 tool-web 的 fetchTimeoutMs 改为 60000，
# 再相应提高插件 config 里的 fetch.totalTimeoutMs（例如 55000）。
